<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给 Hexin 的生日惊喜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c6 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* 铺垫小游戏容器 */
        #game-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #game-title {
            font-size: 24px;
            color: #d6336c;
            margin-bottom: 20px;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
            animation: floatHeart 4s infinite ease-in-out alternate;
        }

        .heart:hover {
            transform: scale(1.2);
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-30px) rotate(10deg); }
        }

        /* 主舞台容器 */
        #main-stage {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        h1 {
            color: #c9184a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5em;
            color: #590d22;
            margin-bottom: 40px;
        }

        .btn-container {
            position: relative;
            width: 300px;
            height: 100px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            position: relative; /* 追逐时会改为fixed */
        }

        #no-btn {
            background-color: #f8f9fa;
            color: #6c757d;
            position: relative; /* 逃跑和追逐时会改为fixed */
        }

        /* 成功消息 */
        #success-msg {
            display: none;
            position: absolute;
            font-size: 3em;
            color: #ff0054;
            font-weight: bold;
            z-index: 20;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <!-- 铺垫小游戏 -->
    <div id="game-container">
        <div id="game-title">点击抓住 3 个漂浮的心形，解锁你的生日惊喜 💖<br><span id="score">0 / 3</span></div>
        <!-- 爱心由JS动态生成 -->
    </div>

    <!-- 生日主舞台 -->
    <div id="main-stage">
        <h1>生日快乐，Hexin！🎂</h1>
        <p>你愿意和我一起过生日吗？</p>
        <div class="btn-container">
            <button id="yes-btn" class="btn">愿意</button>
            <button id="no-btn" class="btn">不愿意</button>
        </div>
    </div>

    <!-- 同意后的提示 -->
    <div id="success-msg">太棒了！期待我们的庆祝！🎉</div>

    <script>
        // --- 变量设置 ---
        // 建议将这里改为 15000 (15秒) 以防她失去耐心关掉网页
        const WAIT_TIME_MS = 40000; 

        // --- 阶段1：铺垫小游戏 ---
        let heartsCaught = 0;
        const totalHearts = 3;
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const mainStage = document.getElementById('main-stage');

        function createHearts() {
            for (let i = 0; i < totalHearts; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'heart';
                // 随机分布在屏幕中
                heart.style.left = Math.random() * 80 + 10 + '%';
                heart.style.top = Math.random() * 80 + 10 + '%';
                // 添加不同的动画延迟使其更自然
                heart.style.animationDelay = (Math.random() * 2) + 's';
                
                heart.onclick = function() {
                    this.remove();
                    heartsCaught++;
                    scoreDisplay.innerText = `${heartsCaught} / ${totalHearts}`;
                    if (heartsCaught === totalHearts) {
                        endGame();
                    }
                };
                gameContainer.appendChild(heart);
            }
        }

        function endGame() {
            gameContainer.style.display = 'none';
            mainStage.style.display = 'flex';
            startBirthdayLogic();
        }

        createHearts(); // 初始化游戏

        // --- 阶段2：生日问答逻辑 ---
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const successMsg = document.getElementById('success-msg');

        let isChasingMode = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        // 记录鼠标实时位置
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function startBirthdayLogic() {
            // 鼠标靠近“不愿意”时逃跑
            noBtn.addEventListener('mouseenter', runawayLogic);

            // 计时器：设定时间后改变状态
            setTimeout(() => {
                enterChasingMode();
            }, WAIT_TIME_MS);
        }

        function runawayLogic() {
            if (isChasingMode) return; // 如果已经是追击模式了，就不逃跑了

            noBtn.style.position = 'fixed';
            
            // 计算安全的随机位置，防止跑出屏幕外
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function enterChasingMode() {
            isChasingMode = true;
            
            // 移除逃跑事件
            noBtn.removeEventListener('mouseenter', runawayLogic);

            // 改变按钮文字和样式
            noBtn.innerText = '愿意';
            noBtn.style.backgroundColor = '#ff4d6d';
            noBtn.style.color = 'white';

            // 将两个按钮都设置为fixed以便平滑追逐
            const yesRect = yesBtn.getBoundingClientRect();
            yesBtn.style.position = 'fixed';
            yesBtn.style.left = yesRect.left + 'px';
            yesBtn.style.top = yesRect.top + 'px';

            // 开始平滑动画循环
            requestAnimationFrame(chaseMouse);
        }

        // --- 阶段3：平滑追逐算法 ---
        // 为两个按钮设定独立的当前位置
        let yesPos = { x: 0, y: 0, initialized: false };
        let noPos = { x: 0, y: 0, initialized: false };

        function chaseMouse() {
            if (!isChasingMode) return;

            // 初始化当前位置
            if (!yesPos.initialized) {
                yesPos.x = yesBtn.offsetLeft;
                yesPos.y = yesBtn.offsetTop;
                yesPos.initialized = true;
            }
            if (!noPos.initialized) {
                noPos.x = noBtn.offsetLeft;
                noPos.y = noBtn.offsetTop;
                noPos.initialized = true;
            }

            // 让两个按钮稍微错开，包围鼠标
            const targetYesX = mouseX - 60;
            const targetYesY = mouseY + 20;
            const targetNoX = mouseX + 10;
            const targetNoY = mouseY - 40;

            // 平滑插值 (缓动因子 0.05，数字越大追得越快)
            yesPos.x += (targetYesX - yesPos.x) * 0.05;
            yesPos.y += (targetYesY - yesPos.y) * 0.05;
            noPos.x += (targetNoX - noPos.x) * 0.05;
            noPos.y += (targetNoY - noPos.y) * 0.05;

            yesBtn.style.left = yesPos.x + 'px';
            yesBtn.style.top = yesPos.y + 'px';
            noBtn.style.left = noPos.x + 'px';
            noBtn.style.top = noPos.y + 'px';

            requestAnimationFrame(chaseMouse);
        }

        // --- 最终胜利逻辑 ---
        function showSuccess() {
            mainStage.style.display = 'none';
            isChasingMode = false;
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
            
            successMsg.style.display = 'block';
        }

        yesBtn.addEventListener('click', showSuccess);
        noBtn.addEventListener('click', () => {
            // 在追击模式下，点击变成“愿意”的 noBtn 也会成功
            if (isChasingMode) showSuccess();
        });

    </script>
</body>
</html>
